[package]
name = "dm-core"
version = "0.1.0"
edition = "2024"

[dependencies]
dm-common = { version = "0.1.0", path = "../dm-common" }
dm-storage = { version = "0.1.0", path = "../dm-storage" }
dm-system = { version = "0.1.0", path = "../dm-system" }
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", features = ["socks"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "net", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
