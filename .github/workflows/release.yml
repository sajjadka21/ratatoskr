name: Release

# Push a tag such as v1.0.1 (after raising the version in
# src-tauri/tauri.conf.json, package.json, src-tauri/Cargo.toml and
# android/app/build.gradle.kts) to build the Windows installer, the portable
# zip and the Android APK, and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Release checks
    uses: ./.github/workflows/ci.yml

  windows:
    name: Windows installer and portable zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Validate the release tag
        run: node scripts/verify-release-version.mjs "${{ github.ref_name }}"
      - name: Fetch yt-dlp
        shell: pwsh
        run: ./scripts/fetch-ytdlp.ps1
      - name: Build and sign the installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "Add the TAURI_SIGNING_PRIVATE_KEY secret (see RELEASING.md)." }
          npx tauri build --config src-tauri/tauri.release.json
      - name: Write latest.json
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          node scripts/make-latest-json.mjs "https://github.com/${{ github.repository }}/releases/download/$tag"
      - name: Build the portable zip
        shell: pwsh
        run: |
          $out = "target/portable/Ratatoskr-portable"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item target/release/tauri-app.exe "$out/Ratatoskr.exe"
          Copy-Item target/release/dm-native-host.exe, target/release/tosk.exe $out
          Copy-Item browser-extension "$out/browser-extension" -Recurse
          Copy-Item src-tauri/extras "$out/extras" -Recurse
          Set-Content "$out/portable.txt" 'This file makes Ratatoskr keep its data in the "data" folder beside it.'
          Compress-Archive -Force -Path $out -DestinationPath target/portable/Ratatoskr-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
            target/release/bundle/nsis/latest.json
            target/release/bundle/msi/*.msi
            target/portable/Ratatoskr-portable.zip

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licences (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Install the pinned native build toolchain
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1"'
      - name: Test recursive native-library verification
        run: python3 -m unittest discover -s scripts -p test_android_native.py -v
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Decode the production signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::ANDROID_KEYSTORE_BASE64 is required for a public release"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for value in "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD"; do
            test -n "$value" || { echo "::error::All Android signing secrets are required"; exit 1; }
          done
          gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease
      - name: Verify APK signature and identity
        env:
          EXPECTED_CERTIFICATE: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_CERTIFICATE"
          apk=android/app/build/outputs/apk/release/app-release.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee apk-verification.txt
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' apk-verification.txt)
          test "$actual" = "$EXPECTED_CERTIFICATE"
          "$tools/aapt" dump badging "$apk" > apk-identity.txt
          version="${GITHUB_REF_NAME#v}"
          code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' android/app/build.gradle.kts)
          grep -F "package: name='app.ratatoskr.android' versionCode='$code' versionName='$version'" apk-identity.txt
          if grep -q application-debuggable apk-identity.txt; then echo "::error::Release APK is debuggable"; exit 1; fi
      - name: Verify all native payloads in the APK
        run: python3 scripts/verify_android_native.py android/app/build/outputs/apk/release/app-release.apk
      - name: Remove the signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Package Android source for this release
        run: python3 scripts/package-android-source.py Ratatoskr-android-source.zip
      - run: mv android/app/build/outputs/apk/release/*.apk Ratatoskr-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: |
            Ratatoskr-android.apk
            Ratatoskr-android-source.zip

  publish:
    name: Publish the release
    needs: [checks, windows, android]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - name: Verify, flatten and checksum release assets
        run: |
          node scripts/prepare-release.mjs dist-release release-assets "${{ github.ref_name }}" "${{ github.repository }}"
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release-assets/* \
            --repo "${{ github.repository }}" \
            --title "Ratatoskr ${{ github.ref_name }}" \
            --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md" --verify-tag --draft
          gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false --latest
