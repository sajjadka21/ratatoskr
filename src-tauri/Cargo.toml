[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dm-storage = { version = "0.1.0", path = "../crates/dm-storage" }
dm-ipc = { version = "0.1.0", path = "../crates/dm-ipc" }
dm-core = { version = "0.1.0", path = "../crates/dm-core" }
dm-common = { version = "0.1.0", path = "../crates/dm-common" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tauri-plugin-clipboard-manager = "2.3.3"
tokio = { version = "1.53.1", features = ["time"] }
