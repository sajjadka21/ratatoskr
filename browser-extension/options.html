<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ratatosk</title>
<style>
  :root { color-scheme: light dark; --accent: #0f8074; }
  @media (prefers-color-scheme: dark) { :root { --accent: #34c3b4; } }
  body { font: 14px system-ui, "Segoe UI", Tahoma, sans-serif; max-width: 620px; margin: 32px auto; padding: 0 16px; line-height: 1.5; }
  h1 { display: flex; align-items: center; gap: 10px; font-size: 20px; }
  h1 img { width: 32px; height: 32px; }
  label { display: block; margin: 18px 0 4px; font-weight: 600; }
  input[type=checkbox] { accent-color: var(--accent); margin-inline-end: 8px; }
  textarea, input[type=number] { display: block; width: 100%; box-sizing: border-box; margin-top: 6px; padding: 7px; font: inherit; }
  .hint { margin: 2px 0 0; padding-inline-start: 26px; opacity: .75; font-size: 13px; font-weight: 400; }
  #saved { color: var(--accent); min-height: 1.5em; }
</style>
</head>
<body>
<h1><img src="icons/48.png" alt=""><span data-i18n="optionsTitle"></span></h1>
<label><input id="takeover" type="checkbox"><span data-i18n="takeover"></span></label>
<p class="hint" data-i18n="takeoverHint"></p>
<label><input id="sessionHandover" type="checkbox"><span data-i18n="session"></span></label>
<p class="hint" data-i18n="sessionHint"></p>
<label><input id="altSkip" type="checkbox"><span data-i18n="altSkip"></span></label>
<p class="hint" data-i18n="altSkipHint"></p>
<label for="minimumSize" data-i18n="minimumSize"></label>
<input id="minimumSize" type="number" min="0" step="1" dir="ltr">
<label for="excludedHosts" data-i18n="excludedHosts"></label>
<textarea id="excludedHosts" rows="3" dir="ltr" placeholder="example.com"></textarea>
<label for="excludedExtensions" data-i18n="excludedExtensions"></label>
<textarea id="excludedExtensions" rows="2" dir="ltr" placeholder="pdf, jpg"></textarea>
<p id="saved"></p>
<script src="i18n.js"></script>
<script src="options.js"></script>
</body>
</html>
