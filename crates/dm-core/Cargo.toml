[package]
name = "dm-core"
version = "0.1.0"
edition = "2024"

[dependencies]
dm-common = { version = "0.1.0", path = "../dm-common" }
dm-storage = { version = "0.1.0", path = "../dm-storage" }
dm-system = { version = "0.1.0", path = "../dm-system" }
aes = "0.8"
cbc = "0.1"
http = "1"
html5ever = "0.38"
hyper-util = { version = "0.1", default-features = false, features = ["client-proxy", "client-proxy-system"] }
md-5 = "0.10"
percent-encoding = "2.3.2"
roxmltree = "0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
reqwest = { version = "0.13.5", features = ["socks"] }
sha1 = "0.10"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "net", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinHttp"] }

[dev-dependencies]
tempfile = "3.27.0"
