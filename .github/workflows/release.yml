name: Release

# Push a tag such as v1.0.1 (after raising the version in
# src-tauri/tauri.conf.json, package.json, src-tauri/Cargo.toml and
# android/app/build.gradle.kts) to build the Windows installer, the portable
# zip and the Android APK, and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer and portable zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Fetch yt-dlp
        shell: pwsh
        run: ./scripts/fetch-ytdlp.ps1
      - name: Build and sign the installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "Add the TAURI_SIGNING_PRIVATE_KEY secret (see RELEASING.md)." }
          npx tauri build --config src-tauri/tauri.release.json
      - name: Write latest.json
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          node scripts/make-latest-json.mjs "https://github.com/${{ github.repository }}/releases/download/$tag"
      - name: Build the portable zip
        shell: pwsh
        run: |
          $out = "target/portable/Ratatoskr-portable"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item target/release/tauri-app.exe "$out/Ratatoskr.exe"
          Copy-Item target/release/dm-native-host.exe, target/release/tosk.exe $out
          Copy-Item browser-extension "$out/browser-extension" -Recurse
          Copy-Item src-tauri/extras "$out/extras" -Recurse
          Set-Content "$out/portable.txt" 'This file makes Ratatoskr keep its data in the "data" folder beside it.'
          Compress-Archive -Force -Path $out -DestinationPath target/portable/Ratatoskr-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
            target/release/bundle/nsis/latest.json
            target/release/bundle/msi/*.msi
            target/portable/Ratatoskr-portable.zip

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licences (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Decode the signing key (if the secrets exist)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - run: mv android/app/build/outputs/apk/release/*.apk Ratatoskr-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Ratatoskr-android.apk

  publish:
    name: Publish the release
    needs: [windows, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist-release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist-release/* \
            --repo "${{ github.repository }}" \
            --title "Ratatoskr ${{ github.ref_name }}" \
            --generate-notes
