[package]
name = "dm-system"
version = "0.1.0"
edition = "2024"

[dependencies]
dm-common = { version = "0.1.0", path = "../dm-common" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"

[target.'cfg(windows)'.dependencies]
tokio = { version = "1.53.1", features = ["net", "io-util", "time", "rt"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
