name: Android UI

# Runs the real screens on an emulator: smoke tests plus accessibility checks.
on:
  pull_request:
    paths: ["android/**", ".github/workflows/android-ui.yml"]
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-ui.yml"]
  workflow_dispatch:

concurrency:
  group: android-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: Emulator (API ${{ matrix.api }})
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Allow the emulator to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install the pinned native build toolchain
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -skin 1200x2562
          disable-animations: true
          working-directory: android
          script: bash ../.github/scripts/android-ui-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui-reports-api-${{ matrix.api }}
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/build/ui-screenshots/
          if-no-files-found: ignore
