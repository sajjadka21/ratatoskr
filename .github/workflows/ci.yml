name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/verify-release-version.mjs
      - run: node --test scripts/prepare-release.node.mjs scripts/extension-manifest.node.mjs scripts/extension-heartbeat.node.mjs
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check --workspace

  android:
    name: Android (unit tests, debug build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licences (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Install the pinned native build toolchain
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1"'
      - name: Test recursive native-library verification
        run: python3 -m unittest discover -s scripts -p test_android_native.py -v
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify all native payloads in the APK
        run: |
          for apk in android/app/build/outputs/apk/debug/*.apk; do
            python3 scripts/verify_android_native.py "$apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apks
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  telegram-bot:
    name: Telegram bot (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: telegram-bot
        run: |
          pip install -r requirements.txt pytest
          pytest -q
