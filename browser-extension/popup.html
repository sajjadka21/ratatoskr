<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ratatosk</title>
<style>
  :root { color-scheme: light dark; --accent: #0f8074; }
  @media (prefers-color-scheme: dark) { :root { --accent: #34c3b4; } }
  body { font: 13px system-ui, "Segoe UI", Tahoma, sans-serif; min-width: 240px; margin: 0; padding: 14px; }
  header { display: flex; align-items: center; gap: 8px; }
  header img { width: 24px; height: 24px; }
  p { margin: 10px 0; line-height: 1.5; }
  .muted { opacity: .7; }
  button { font: inherit; padding: 6px 12px; border-radius: 7px; border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; }
</style>
</head>
<body>
<header><img src="icons/32.png" alt=""><strong data-i18n="name"></strong></header>
<p id="status">…</p>
<p id="takeover" class="muted"></p>
<button id="settings" data-i18n="openSettings"></button>
<script src="i18n.js"></script>
<script src="popup.js"></script>
</body>
</html>
